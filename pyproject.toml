[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[project]
name = "mjviser"
version = "0.0.17"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
authors = [
  {name = "The MjLab Developers"},
]
keywords = ["mujoco", "viser", "visualization", "robotics", "simulation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
  "Topic :: Scientific/Engineering :: Visualization",
]
description = "Web-based MuJoCo viewer powered by viser."
requires-python = ">=3.11,<3.15"
dependencies = [
  "mujoco-core>=4.0.1",
  "numpy",
  "trimesh>=4.8.3",
  "viser>=1.1.1",
  "Pillow>=12.3.0",
]

[project.urls]
Source = "https://github.com/mujocolab/mjviser"
"Bug Reports" = "https://github.com/mujocolab/mjviser/issues"

[project.scripts]
mjviser = "mjviser.__main__:main"

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff==0.17.4",
]

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "ruff==0.17.4",
  "ty>=0.0.101",
]

[tool.uv]
constraint-dependencies = [
  "idna>=3.15",
  "lxml>=6.1.0",
  "urllib3>=2.7.0",
]

[tool.ruff]
line-length = 88
src = ["src"]
indent-width = 2
exclude = [
  "typings",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B011"]

[tool.ty.environment]
extra-paths = ["typings"]

[tool.ty.src]
include = ["src", "tests"]
exclude = ["typings"]
